<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
<!-- Icono de Axia para Google y las pestañas: gema blanca sobre negro (como la foto de perfil), se ve en fondo claro y oscuro -->
<rect width="200" height="200" rx="44" fill="#000000"/>
<defs><clipPath id="g"><polygon points="100,20 160,72 100,182 40,72"/></clipPath></defs>
<g transform="translate(100 100) scale(0.78) translate(-100 -101)">
<g clip-path="url(#g)" stroke="#FFFFFF" stroke-width="13" stroke-linecap="butt">
<line x1="30" y1="72" x2="170" y2="72"/>
<line x1="100" y1="20" x2="63.9" y2="150"/>
<line x1="100" y1="20" x2="136.1" y2="150"/>
</g>
<polygon points="100,20 160,72 100,182 40,72" stroke="#FFFFFF" stroke-width="13" stroke-linejoin="bevel"/>
</g>
</svg>
